<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveSync Admin | Full Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
        }

        .login-card {
            background: #1a1a3e;
            border-radius: 48px;
            padding: 48px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #e94560;
        }

        .login-card h2 {
            color: #ffd966;
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-card .input-group {
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid #2a2a5a;
            background: #0f0f2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .login-card input:focus {
            border-color: #e94560;
        }

        .login-card button {
            background: #e94560;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
        }

        .error-msg {
            color: #ff8888;
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        /* Admin Dashboard */
        .admin-dashboard {
            display: none;
        }

        .header {
            background: linear-gradient(135deg, #1a1a3e, #16213e);
            padding: 24px 28px;
            border-radius: 28px;
            margin-bottom: 28px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #e94560;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: #e94560;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .logout-admin {
            background: #b71c1c;
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #1a1a3e;
            border-radius: 24px;
            padding: 20px;
            color: white;
            text-align: center;
            border-left: 5px solid #e94560;
        }

        .stat-card h3 {
            font-size: 2.2rem;
            margin-bottom: 6px;
            color: #ffd966;
        }

        .panel {
            background: #0f0f2a;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid #2a2a4a;
        }

        .panel h2 {
            color: #ffd966;
            border-left: 6px solid #e94560;
            padding-left: 18px;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .control-group {
            background: #1a1a3e;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .control-group h3 {
            color: #ffd966;
            margin-bottom: 15px;
        }

        .flex-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .flex-row .input-group {
            flex: 1;
            min-width: 180px;
        }

        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid #2a2a5a;
            background: #0f0f2a;
            color: white;
            outline: none;
        }

        .btn-primary {
            background: #e94560;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            color: white;
            cursor: pointer;
        }

        .btn-secondary {
            background: #2e7d32;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            color: white;
            cursor: pointer;
        }

        .message-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .message-item {
            background: #1a1a3e;
            padding: 12px;
            margin: 8px 0;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-text {
            flex: 1;
            color: #ddd;
        }

        .message-actions button {
            background: #e94560;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a3a;
            border-radius: 16px;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a5a;
            font-size: 0.85rem;
        }

        th {
            background: #16213e;
            color: #ffd966;
            font-weight: 600;
        }

        tr:hover {
            background: #252550;
        }

        .password-cell {
            font-family: monospace;
            background: #2a1a3a;
            font-weight: bold;
            color: #ffaa66;
        }

        .action-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .action-REGISTER { background: #2e7d32; color: white; }
        .action-LOGIN { background: #0288d1; color: white; }
        .action-LOVE_CALCULATION { background: #c2185b; color: white; }
        .action-LOGOUT { background: #d32f2f; color: white; }
        .action-ADMIN_OVERRIDE { background: #ff8c00; color: white; }

        .refresh-btn {
            background: #e94560;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 32px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            th, td {
                padding: 8px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div id="adminRoot"></div>

<script>
    // ==================== ADMIN CREDENTIALS ====================
    const ADMIN_KEY = 'lovesync_admin_credentials';
    const ADMIN_SESSION_KEY = 'lovesync_admin_session';
    const USERS_KEY = 'lovesync_users_detailed';
    const ACTIVITY_KEY = 'lovesync_activity_detailed';
    const LOVE_HISTORY_KEY = 'lovesync_love_history';
    const MESSAGES_KEY = 'lovesync_messages';

    function getAdminCredentials() {
        const stored = localStorage.getItem(ADMIN_KEY);
        if (stored) return JSON.parse(stored);
        const defaultAdmin = { id: "admin@lovesync.com", password: "Admin@123" };
        localStorage.setItem(ADMIN_KEY, JSON.stringify(defaultAdmin));
        return defaultAdmin;
    }

    function isAdminLoggedIn() {
        const sess = localStorage.getItem(ADMIN_SESSION_KEY);
        return sess ? JSON.parse(sess).loggedIn : false;
    }

    function setAdminSession(loggedIn) {
        localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ loggedIn, timestamp: Date.now() }));
    }

    // ==================== DATA FUNCTIONS ====================
    function getUsers() {
        const data = localStorage.getItem(USERS_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getActivity() {
        const data = localStorage.getItem(ACTIVITY_KEY);
        return data ? JSON.parse(data) : [];
    }

    function getLoveHistory() {
        const data = localStorage.getItem(LOVE_HISTORY_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveLoveHistory(history) {
        localStorage.setItem(LOVE_HISTORY_KEY, JSON.stringify(history));
    }

    function getMessages() {
        const stored = localStorage.getItem(MESSAGES_KEY);
        if (stored) return JSON.parse(stored);
        return {
            psychologyMessages: [
                "💞 Secure Attachment Style: You both share trust, emotional availability & genuine warmth.",
                "🔥 Anxious-Passionate Bond: Intense chemistry and deep emotions.",
                "🌸 Avoidant-Meets-Secure: Growth journey ahead — patience brings you closer.",
                "✨ Eros Love: Magnetic attraction, romance and deep desire rule your connection.",
                "🍃 Ludus Playful Love: Fun, flirty & carefree — keep the spark alive.",
                "💜 Agape Love: Selfless & compassionate; you uplift each other's souls.",
                "🌙 Storge Love: Best friends & steady flame — companionship at its finest.",
                "🧠 Psychology Insight: Your love languages align through acts of service.",
                "🌈 Cosmic Match: Vulnerability is your superpower.",
                "💎 Twin Flame Vibration: Mirror each other's strengths beautifully.",
                "🦋 Growth-Oriented Love: You challenge each other to become better.",
                "🌟 Soulmate Recognition: Deep sense of knowing."
            ],
            loveCycles: [
                "❤️ Romantic Phase: Butterflies & new discoveries",
                "🌀 Trust Building Cycle: Deepening emotional safety",
                "⚡ Power Struggle → Learning compromise",
                "🌿 Commitment Renewal: Re-choosing each other daily",
                "✨ Synergy Cycle: Creativity & shared joy",
                "🌙 Shadow Integration: Healing old wounds together",
                "🌟 Spiritual Union: Beyond ego, pure soul connection"
            ]
        };
    }

    function saveMessages(psychologyMessages, loveCycles) {
        localStorage.setItem(MESSAGES_KEY, JSON.stringify({ psychologyMessages, loveCycles }));
    }

    function logActivity(email, action, details) {
        let logs = localStorage.getItem(ACTIVITY_KEY);
        let arr = logs ? JSON.parse(logs) : [];
        arr.unshift({ email, action, timestamp: new Date().toLocaleString(), details });
        if (arr.length > 200) arr.pop();
        localStorage.setItem(ACTIVITY_KEY, JSON.stringify(arr));
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==================== ADMIN DASHBOARD ====================

        root.innerHTML = `

                </div>

                <!-- Stats -->

                <!-- Users Table -->
                <div class="panel">

                    <div class="table-wrapper">
                        <table id="usersTable">
                            <thead><tr><th>Full Name</th><th>Email (ID)</th><th>Password</th><th>Registered</th><th>Recent Partners</th><th>Last %</th></tr></thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Love History -->
                <div class="panel">
                    <h2>💖 All Love Calculations (Including Admin Overrides)</h2>
                    <div class="table-wrapper">
                        <table id="loveTable">
                            <thead><tr><th>User</th><th>Your Name</th><th>Partner</th><th>%</th><th>Psychology</th><th>Cycle</th><th>Time</th><th>Type</th></tr></thead>
                            <tbody id="loveTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Activity Log -->
                <div class="panel">
                    <h2>🕒 Live Activity Log</h2>
                    <div class="table-wrapper">
                        <table id="activityTable">
                            <thead><tr><th>User</th><th>Action</th><th>Time</th><th>Details</th></tr></thead>
                            <tbody id="activityBody"></tbody>
                        </table>
                    </div>
                    <button class="refresh-btn" id="forceRefreshBtn">⟳ Refresh All Data</button>
                </div>
                <div class="footer">⚡ Admin can add any love % + edit messages shown to users</div>
            </div>
        `;

        // Load users into dropdown
        function loadUserDropdown() {
            const users = getUsers();
            const select = document.getElementById('manualUserSelect');
            if (select) {
                select.innerHTML = '<option value="">-- Select User --</option>' + 
                    users.map(u => `<option value="${escapeHtml(u.email)}">${escapeHtml(u.fullname)} (${escapeHtml(u.email)})</option>`).join('');
            }
        }

        // Render message lists
        function renderMessages() {
            const messages = getMessages();
            const psychList = document.getElementById('psychologyMessagesList');
            const cyclesList = document.getElementById('loveCyclesList');
            
            if (psychList) {
                psychList.innerHTML = messages.psychologyMessages.map((msg, idx) => `
                    <div class="message-item">
                        <span class="message-text">${escapeHtml(msg)}</span>
                        <div class="message-actions">
                            <button onclick="editPsychMessage(${idx})">✏️ Edit</button>
                            <button onclick="deletePsychMessage(${idx})">🗑️ Delete</button>
                        </div>
                    </div>
                `).join('');
            }
            
            if (cyclesList) {
                cyclesList.innerHTML = messages.loveCycles.map((cycle, idx) => `
                    <div class="message-item">
                        <span class="message-text">${escapeHtml(cycle)}</span>
                        <div class="message-actions">
                            <button onclick="editCycleMessa
